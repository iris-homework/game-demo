<?xml version="1.0" encoding="UTF-8"?>
<!-- 午夜委托 · 地点标记统一外框（selected / 当前选中）
     与 normal、hover 使用同一形状、同一 64x72 viewBox，仅边线颜色不同。
     符号安全区：x12 y12 w40 h34。 -->
<svg xmlns="http://www.w3.org/2000/svg" width="64" height="72" viewBox="0 0 64 72" shape-rendering="geometricPrecision">
  <!-- 深蓝紫不透明牌面 + 近黑外描边 -->
  <path d="M8 3 L53 3 L61 11 L61 53 L38 53 L32 67 L25 53 L3 53 L3 12 Z"
        fill="#101421" stroke="#070E19" stroke-width="2.4" stroke-linejoin="miter" stroke-miterlimit="6"/>
  <!-- 低饱和金属亮边（内圈，选中时让位给状态色） -->
  <path d="M9.3 4.6 L51.7 4.6 L59.4 12.6 L59.4 51.4 L37.4 51.4 L32 65.3 L26.6 51.4 L4.6 51.4 L4.6 13.6 Z"
        fill="none" stroke="#55637c" stroke-width="1" stroke-linejoin="miter" stroke-miterlimit="6" opacity="0.5"/>
  <!-- selected 洋红亮边 -->
  <path d="M9.6 4.9 L51.4 4.9 L59.1 12.9 L59.1 51.1 L37.3 51.1 L32 64.9 L26.7 51.1 L4.9 51.1 L4.9 13.9 Z"
        fill="none" stroke="#f04b88" stroke-width="1.8" stroke-linejoin="miter" stroke-miterlimit="6"/>
  <!-- 很轻的外缘洋红边，避免大面积辉光 -->
  <path d="M8 3 L53 3 L61 11 L61 53 L38 53 L32 67 L25 53 L3 53 L3 12 Z"
        fill="none" stroke="#f04b88" stroke-width="1" stroke-linejoin="miter" stroke-miterlimit="6" opacity="0.32"/>
  <!-- 上沿金属高光 -->
  <path d="M10 4.6 L50.6 4.6" fill="none" stroke="#8f9db8" stroke-width="0.8" stroke-linecap="round" opacity="0.75"/>
</svg>
